name: Build

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # dd.ps1 locates Visual Studio, enters the MSVC environment and falls back
      # to the CMake and Ninja that ship with it, so there is nothing to install.
      - name: Build and test
        shell: pwsh
        run: .\dd.ps1 test -Config Debug
